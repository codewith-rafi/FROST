# 100-step GPU util gate — baseline knobs identical to course except max_train_steps
protocol: util_gate
dataset: horse2zebra
method: util_gate_100
tmux_session: frost_h2z_util_gate_100
pretrained_model_name_or_path: stabilityai/sd-turbo
dataset_folder: data/horse2zebra
output_dir: OUTPUT_DIR_PLACEHOLDER
granular_mask_dir: null
train_img_prep: resize_286_randomcrop_256x256_hflip
val_img_prep: no_resize
learning_rate: 1.0e-5
max_train_steps: 100
max_train_epochs: 1
train_batch_size: 1
gradient_accumulation_steps: 1
seed: 42
report_to: wandb
tracker_project_name: granular_cycle_turbo
enable_xformers_memory_efficient_attention: false
allow_tf32: true
validation_steps: 100
checkpointing_steps: 100
validation_num_images: 0
viz_freq: 0
dataloader_num_workers: 8
lambda_gan: 0.5
lambda_idt: 1
lambda_cycle: 1
lambda_cycle_lpips: 10
lambda_idt_lpips: 1
granular_mode: none
lambda_granular: 0.0
lora_rank_unet: 128
lora_rank_vae: 4
